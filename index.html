<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minik Okur - Eğlenceli Öğrenme</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Havai Fişek Canvas Alanı -->
    <canvas id="fireworksCanvas"></canvas>

    <div class="app-container">
        <header>
            <h1>🌟 MİNİK OKUR 🌟</h1>
            <div class="stats-board">
                <div class="stat-box">
                    <span class="label">Puan</span>
                    <span id="score">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">Doğru</span>
                    <span id="solvedCount">0</span>
                </div>
            </div>
        </header>

        <main>
            <div class="question-card">
                <span class="clue-title">Bunu Oluştur:</span>
                <p id="targetWordText">EL</p>
            </div>

            <div class="word-display" id="wordDisplay">_ _</div>
            
            <div class="letters-container" id="lettersContainer">
                <!-- Harf butonları -->
            </div>

            <div class="controls">
                <button class="btn btn-secondary" onclick="clearInput()">Sil 🧹</button>
                <button class="btn btn-primary" onclick="submitWord()">Kontrol Et ✨</button>
            </div>
        </main>

        <div id="message" class="message-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
