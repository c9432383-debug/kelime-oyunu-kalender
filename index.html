<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kelime Avcısı Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>KELİME AVCISI</h1>
            <div class="stats-board">
                <div class="stat-box">
                    <span class="label">Seviye</span>
                    <span id="level">1</span>
                </div>
                <div class="stat-box">
                    <span class="label">Puan</span>
                    <span id="score">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">Süre</span>
                    <span id="timer">60</span>s
                </div>
            </div>
        </header>

        <main>
            <div class="word-display" id="wordDisplay">_ _ _ _</div>
            
            <div class="letters-container" id="lettersContainer">
                <!-- Harf butonları -->
            </div>

            <div class="action-buttons">
                <button class="btn btn-shuffle" onclick="shuffleLetters()">🔀 Karıştır</button>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" onclick="clearInput()">Temizle</button>
                <button class="btn btn-primary" onclick="submitWord()">Gönder</button>
            </div>
        </main>

        <div id="message" class="message-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
