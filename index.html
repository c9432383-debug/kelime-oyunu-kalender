<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kelime Ustası - Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="game-brand">KELİME USTASI</div>
            <div class="stats-board">
                <div class="stat-box">
                    <span class="label">Soru</span>
                    <span id="questionNum">1/5</span>
                </div>
                <div class="stat-box">
                    <span class="label">Puan</span>
                    <span id="score">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">Süre</span>
                    <span id="timer">20s</span>
                </div>
            </div>
        </header>

        <main>
            <div class="clue-card">
                <span class="clue-tag">İPUCU</span>
                <p id="clueText">Oyun yükleniyor...</p>
            </div>

            <div class="word-display" id="wordDisplay">_ _ _ _</div>
            
            <div class="letters-container" id="lettersContainer">
                <!-- Harfler buraya gelecektir -->
            </div>

            <div class="jokers-bar">
                <button class="btn-joker" onclick="useHint()">💡 Harf Al (-10P)</button>
                <button class="btn-joker" onclick="shuffleLetters()">🔀 Karıştır</button>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" onclick="clearInput()">Sil</button>
                <button class="btn btn-primary" onclick="submitWord()">Cevapla</button>
            </div>
        </main>

        <div id="message" class="message-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
